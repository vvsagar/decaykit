stages:
  - test
  - build

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .venv
  script:
    - uv sync --frozen
    - uv run ruff check src tests
    - uv run mypy
    - uv run pytest

build:
  stage: build
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv build
    - uvx twine check dist/*
  artifacts:
    paths:
      - dist/
